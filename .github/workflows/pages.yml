name: Publish
# Every push to main is tested, built and published to GitHub Pages. The published version.json is what makes
# "merged" and "live" two different moments: between them, Job Book's live check still reads the old commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: run the suite
        env:
          # tools/net-audit.cjs (a copy of preflight's) in every Node process the tests start: each outbound connection
          # is logged, and any off loopback is REFUSED, so no test can reach a live host from here.
          NODE_OPTIONS: --require ${{ github.workspace }}/tools/net-audit.cjs
          NET_AUDIT_LOG: ${{ runner.temp }}/net-audit.jsonl
        # Output also goes to suite-output.log, for "no test skipped". PIPESTATUS, not tee's 0.
        run: |
          { node --test 'test/*.test.js'; } 2>&1 | tee -a "$RUNNER_TEMP/suite-output.log"
          exit "${PIPESTATUS[0]}"
      # Did any test skip itself? A skipped test passes without running, so the suite can go green on less than it
      # claims. node --test prints one "skipped N" summary line (ℹ in the spec reporter, # in TAP); this fails on any
      # N above 0, and also when no summary line was printed at all: then nothing was checked. Same gate as router's and
      # pressroom's (2026-09-24). Because publish needs this job, a skipped test also stops the site being published.
      - name: no test skipped
        if: always()
        run: |
          LOG="$RUNNER_TEMP/suite-output.log"
          test -s "$LOG" || { echo "::error::$LOG is missing or empty — the suite's output was not captured, so nothing was checked"; exit 1; }
          COUNTS=$(grep -E '^(ℹ|#) skipped [0-9]+$' "$LOG" || true)
          [ -n "$COUNTS" ] || { echo "::error::no 'skipped N' summary line in the suite output, so nothing was checked"; exit 1; }
          echo "$COUNTS"
          if echo "$COUNTS" | grep -qvE ' skipped 0$'; then
            echo "::error::a test was SKIPPED, so it passed without running (count above)"
            exit 1
          fi
      # Did any test reach a real host? Added 2026-09-24 after the same audit, run over preflight's suite, found a test
      # sending the developer's own key to the live workspace. A missing or empty log is red too: nothing was measured.
      - name: no test reached a real host
        if: always()
        run: |
          node tools/net-audit.cjs "${{ runner.temp }}/net-audit.jsonl" || {
            echo "::error::a test connected (or tried to) to a host off loopback, or the audit log was not written — see the lines above"
            exit 1
          }

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
